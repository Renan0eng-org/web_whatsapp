name: Deploy Frontend WhatsApp (PM2)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mostrar versão do node
        run: |
          node -v
          which node
          npm -v

      - name: Clean
        run: |
          rm -rf node_modules
          rm -rf .next
          rm -f package-lock.json

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Build do Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://whatsapp.back.renannardi.com

      - name: Deploy com PM2
        run: |
          node -v
          which node

          pm2 stop web-whatsapp || true
          pm2 delete web-whatsapp || true

          pm2 start npm \
            --name web-whatsapp \
            -- start \
            -- -p 3030

          pm2 save
